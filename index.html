<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tacos Yassinos</title>
    <style>
        :root{--red:#7a0a12;--red2:#9a1520;--gold:#2ecc71;--ink:#fff;--card:#8a1520;--bg:#4d0509;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif}
        header{background:linear-gradient(135deg,#b3121f,#6e0008);color:#fff;border-bottom:4px solid var(--gold);text-align:center;padding:16px 12px}
        header h1{margin:0;font-size:26px;letter-spacing:1px;cursor:pointer;user-select:none;}
        header small{display:block;font-weight:700;margin-top:4px}
        .contact{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
        .contact a{background:var(--gold);color:#06280f;padding:9px 14px;border-radius:20px;text-decoration:none;font-weight:800;font-size:14px}
        nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--red);display:flex;overflow-x:auto;gap:6px;padding:8px;scrollbar-width:none}
        nav button{flex:none;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:18px;padding:7px 13px;font-weight:700}
        nav button.on{background:var(--gold);color:#1a1a1a}
        main{padding:12px 12px 90px;max-width:720px;margin:auto}
        h2{color:var(--gold);margin:18px 0 8px;border-bottom:2px solid var(--gold);padding-bottom:4px}
        .it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 2px 8px #0006;border-left:4px solid var(--gold)}
        .it .e{width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.2);border-radius:10px;font-size:32px;flex:none;box-shadow:0 0 0 2px var(--gold)}
        .it .n{flex:1;font-weight:600}
        .it .p{color:var(--gold);font-weight:700;font-size:14px}
        .b{background:var(--gold);color:#1a1a1a;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;}
        .b:disabled{background:#999}
        .sz{display:flex;gap:6px}
        #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--red);border-top:2px solid var(--gold);z-index:6}
        #bar button{width:100%;font-size:16px;padding:13px}
        input,select{width:100%;padding:10px;border-radius:9px;border:0;margin:4px 0;font-size:15px;background:#fff;color:#222}
        .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
        .q button{width:30px;height:30px;border-radius:8px;border:0;background:var(--gold);font-weight:800;cursor:pointer;}
        .q span{display:inline-block;min-width:26px;text-align:center}
        .tot{border-top:1px solid var(--gold);margin-top:8px;padding-top:8px}
        .hide{display:none}
        header h1{text-shadow:0 2px 6px #0007}
        .admin-box{background:rgba(0,0,0,0.85); padding:12px; margin-top:12px; border-radius:10px; border:1px solid var(--gold); text-align:right;}
    </style>
</head>
<body>

<header>
    <h1 onclick="handleTitleClick()">🌮 TACOS YASSINOS</h1>
    <small>Livraison jusqu'à domicile · التوصيل حتى الدار</small>
    
    <!-- لوحة التحكم السرية (تعديل الأثمنة + إضافة أطباق جديدة) -->
    <div id="priceEditorPanel" class="hide admin-box">
        <p style="color: var(--gold); margin: 0 0 6px 0; font-size: 14px; font-weight: bold;">🛠️ تعديل الأثمنة الحالية</p>
        <select id="itemSelect" style="margin-bottom: 6px;"></select>
        <input type="number" id="itemNewPrice" placeholder="السعر الجديد" style="margin-bottom: 10px;">
        <button class="b" onclick="saveNewPrice()" style="width: 100%; margin-bottom: 15px;">حفظ السعر الجديد</button>

        <hr style="border-color: rgba(255,255,255,0.2);">

        <p style="color: var(--gold); margin: 10px 0 6px 0; font-size: 14px; font-weight: bold;">➕ إضافة طبق جديد للقائمة</p>
        <select id="newCategorySelect" style="margin-bottom: 6px;"></select>
        <input type="text" id="newDishName" placeholder="اسم الطبق الجديد (مثال: Tacos Spécial)" style="margin-bottom: 6px;">
        <input type="number" id="newDishPrice" placeholder="ثمن الطبق (مثال: 35)" style="margin-bottom: 8px;">
        <button class="b" onclick="addNewDish()" style="width: 100%;">إضافة الطبق للقائمة</button>
    </div>

    <div class="contact">
        <a href="tel:+212661057031">📞 0661-057031</a>
        <a href="tel:+212673263838">📞 0673-263838</a>
        <a href="https://wa.me/212661057031">💬 WhatsApp</a>
    </div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<div id="bar"><button class="b" id="cartBtn" onclick="openCart()">🛒 Voir le panier</button></div>

<script>
const WA = "212661057031";
const E = {
    TACOS: "🌯", 
    PANINI: "🥪", 
    CHAWARMA: "🥙", 
    PIZZA: "🍕", 
    SALADES: "🥗", 
    PLATS: "🍢", 
    PASTICCIO: "🧀", 
    "PÂTES": "🍝", 
    SUPPLÉMENTS: "🍟", 
    BOISSONS: "🥤", 
    DESSERT: "🍰"
};

const defaultMenu = {
    TACOS: [
        ["Tacos Poulet", 30], ["Tacos Viande", 30], ["Tacos Nuggets", 30], 
        ["Tacos Chawarma", 30], ["Tacos Mixte", 30], ["Tacos Crispy", 30], 
        ["Tacos Jambon", 30], ["Tacos Mexicain", 32], ["Cordon Bleu", 32], 
        ["Big Tacos", 37], ["Tacos Torittos", 39], ["Tacos Gratiné", 40], 
        ["Tacos Poulet XL", 55], ["Viande Hachée XL Tacos", 55], 
        ["Tacos Crispy XL", 58], ["Mixte XL", 58], ["Tacos Gega", 150]
    ],
    PANINI: [
        ["Panini Poulet", 25], ["Panini Viande Hachée", 25], 
        ["Panini Nuggets", 25], ["Panini Mixte", 26]
    ],
    CHAWARMA: [
        ["Chawarma Normale", 25], ["Fromage + Frite", 30], ["Double Fromage", 32]
    ],
    PIZZA: [
        ["Pizza Margarita", [20, 30]], ["Pizza Végétarienne", [20, 30]], 
        ["Pizza Pepperoni", [25, 35]], ["Pizza Viande Hachée", [25, 35]], 
        ["Pizza Poulet", [25, 35]], ["Pizza Thon", [25, 35]], 
        ["Pizza 4 Saisons", [30, 37]], ["Pizza Chawarma", [28, 38]], 
        ["Pizza Fruits de Mer", [30, 45]]
    ],
    SALADES: [
        ["Salade Chef", 20], ["Salade Riche", 25], ["Salade Crispy", 25], 
        ["Salade Variée", 30], ["Salade Fruits de Mer", 40]
    ],
    PLATS: [
        ["Brochette Poulet", 35], ["Brochette Viande", 35], 
        ["Plat Crispy", 35], ["Plat Chawarma", 35], ["Plat Émincé", 40]
    ],
    PASTICCIO: [
        ["Pasticcio Poulet", 35], ["Pasticcio Jambon", 30], 
        ["Pasticcio Nuggets", 35], ["Pasticcio Viande Hachée", 35], 
        ["Pasticcio Mixte", 35], ["Pasticcio Cordon Bleu", 35], 
        ["Pasticcio Chawarma", 35], ["Pasticcio Fruits de Mer", 45], 
        ["Kassriya Pasticcio", 150]
    ],
    "PÂTES": [
        ["Pâtes Charcuterie", 35], ["Pâtes Poulet", 35], 
        ["Pâtes Bolognaise", 35], ["Pâtes Fruits de Mer", 45]
    ],
    SUPPLÉMENTS: [
        ["Portion de frites", 7], ["Supplément fromage", 3], 
        ["6 pièces Nuggets", 25], ["6 Mozza Sticks", 35]
    ],
    BOISSONS: [
        ["Jus citron / orange", 10], ["Jus avocat", 30], 
        ["Jus Panaché", 18], ["Soda 1 L", 15]
    ],
    DESSERT: [
        ["Tiramisu", 20]
    ]
};

let savedMenu = localStorage.getItem("yassinos_custom_menu");
let M = savedMenu ? JSON.parse(savedMenu) : defaultMenu;

let currentCategory = Object.keys(M)[0];
let cart = [];

const SECRET_PIN = "1234";
let clickCount = 0;
let clickTimer = null;

function handleTitleClick() {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { clickCount = 0; }, 1000);

    if (clickCount >= 5) {
        clickCount = 0;
        let pin = prompt("أدخل الرمز السري للوحة التحكم:");
        if (pin === SECRET_PIN) {
            alert("تم التحقق بنجاح!");
            togglePriceEditor();
        } else if (pin !== null) {
            alert("الرمز السري غير صحيح!");
        }
    }
}

function togglePriceEditor() {
    const panel = document.getElementById("priceEditorPanel");
    panel.classList.toggle("hide");
    if (!panel.classList.contains("hide")) {
        populateItemSelect();
        populateCategorySelect();
    }
}

function populateItemSelect() {
    const select = document.getElementById("itemSelect");
    select.innerHTML = "";
    for (let cat in M) {
        M[cat].forEach((item, index) => {
            let opt = document.createElement("option");
            opt.value = `${cat}___${index}`;
            let priceText = Array.isArray(item[1]) ? item[1].join('/') : item[1];
            opt.textContent = `[${cat}] ${item[0]} (${priceText} دج)`;
            select.appendChild(opt);
        });
    }
}

function populateCategorySelect() {
    const select = document.getElementById("newCategorySelect");
    select.innerHTML = "";
    for (let cat in M) {
        let opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = `${E[cat] || '🍽️'} ${cat}`;
        select.appendChild(opt);
    }
}

function saveNewPrice() {
    const val = document.getElementById("itemSelect").value;
    const newPriceVal = parseFloat(document.getElementById("itemNewPrice").value);
    
    if (!val || isNaN(newPriceVal)) {
        alert("الرجاء اختيار المنتج وإدخال سعر صحيح.");
        return;
    }

    let [cat, index] = val.split("___");
    index = parseInt(index);

    if (Array.isArray(M[cat][index][1])) {
        M[cat][index][1][0] = newPriceVal;
    } else {
        M[cat][index][1] = newPriceVal;
    }

    localStorage.setItem("yassinos_custom_menu", JSON.stringify(M));
    alert("تم تحديث السعر بنجاح!");
    togglePriceEditor();
    renderMain();
}

// دالة إضافة طبق جديد للقائمة
function addNewDish() {
    const cat = document.getElementById("newCategorySelect").value;
    const name = document.getElementById("newDishName").value.trim();
    const price = parseFloat(document.getElementById("newDishPrice").value);

    if (!name || isNaN(price)) {
        alert("الرجاء إدخال اسم الطبق وثمنه بشكل صحيح.");
        return;
    }

    // إضافة الطبق الجديد للمصفوفة الخاصة بالقسم
    M[cat].push([name, price]);

    // الحفظ في التخزين المحلي
    localStorage.setItem("yassinos_custom_menu", JSON.stringify(M));
    
    alert(`تمت إضافة "${name}" إلى قسم ${cat} بنجاح!`);
    
    // تفريغ الحقول وإغلاق اللوحة وتحديث العرض
    document.getElementById("newDishName").value = "";
    document.getElementById("newDishPrice").value = "";
    togglePriceEditor();
    
    // الانتقال تلقائياً للقسم الذي أضفت إليه الطبق لترسيه فوراً
    currentCategory = cat;
    renderNav();
    renderMain();
}

function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = '';
    Object.keys(M).forEach(k => {
        let btn = document.createElement('button');
        btn.textContent = (E[k] || '🍽️') + ' ' + k;
        if (k === currentCategory) btn.className = 'on';
        btn.onclick = () => {
            currentCategory = k;
            renderNav();
            renderMain();
        };
        nav.appendChild(btn);
    });
}

function renderMain() {
    const main = document.getElementById('main');
    main.innerHTML = `<h2>${(E[currentCategory] || '🍽️')} ${currentCategory}</h2>`;
    
    if (!M[currentCategory]) return;

    M[currentCategory].forEach((item, i) => {
        let div = document.createElement('div');
        div.className = 'it';
        let name = item[0], price = item[1];
        let pHTML = '';
        
        if (Array.isArray(price)) {
            pHTML = `<div class="sz"><button class="b" onclick="addToCart('${currentCategory}', ${i}, 0)">Petit: ${price[0]}dh</button><button class="b" onclick="addToCart('${currentCategory}', ${i}, 1)">Grand: ${price[1]}dh</button></div>`;
        } else {
            pHTML = `<div class="p">${price} DH</div><button class="b" onclick="addToCart('${currentCategory}', ${i})">+</button>`;
        }
        
        div.innerHTML = `<div class="e">${E[currentCategory] || '🍽️'}</div><div class="n">${name}</div>${pHTML}`;
        main.appendChild(div);
    });
}

function addToCart(cat, idx, sizeIdx) {
    let item = M[cat][idx];
    let name = item[0], price = item[1];
    let sizeName = '', finalPrice = price;
    
    if (Array.isArray(price)) {
        finalPrice = price[sizeIdx];
        sizeName = (sizeIdx === 0 ? ' (Petit)' : ' (Grand)');
    }
    
    let found = cart.find(c => c.cat === cat && c.idx === idx && c.sizeIdx === sizeIdx);
    if (found) {
        found.qty++;
    } else {
        cart.push({ cat, idx, sizeIdx, name: name + sizeName, price: finalPrice, qty: 1 });
    }
    updateBar();
}

function openCart() {
    let main = document.getElementById('main');
    let html = `<h2>🛒 Mon Panier</h2>`;
    if (cart.length === 0) {
        html += `<p>Le panier est vide.</p>`;
    } else {
        cart.forEach((c, i) => {
            html += `<div class="row"><span>${c.name} - ${c.price} DH</span><div class="q"><button onclick="changeQty(${i}, -1)">-</button><span>${c.qty}</span><button onclick="changeQty(${i}, 1)">+</button></div></div>`;
        });
        let tot = cart.reduce((s, c) => s + c.price * c.qty, 0);
        html += `<div class="row tot"><b>Total:</b> <b>${tot} DH</b></div><button class="b" style="width:100%;margin-top:15px;" onclick="sendWA()">Envoyer sur WhatsApp 💬</button>`;
    }
    main.innerHTML = html;
}

function changeQty(i, d) {
    cart[i].qty += d;
    if (cart[i].qty <= 0) cart.splice(i, 1);
    openCart();
    updateBar();
}

function updateBar() {
    let totalQty = cart.reduce((s, c) => s + c.qty, 0);
    let totalPrice = cart.reduce((s, c) => s + c.price * c.qty, 0);
    let btn = document.getElementById('cartBtn');
    btn.textContent = totalQty > 0 ? `🛒 Panier (${totalQty} articles) - ${totalPrice} DH` : `🛒 Voir le panier`;
}

function sendWA() {
    let txt = "Bonjour, je souhaite commander:%0A";
    cart.forEach(c => { txt += `- ${c.qty}x ${c.name} (${c.price * c.qty} DH)%0A`; });
    let tot = cart.reduce((s, c) => s + c.price * c.qty, 0);
    txt += `%0ATotal: ${tot} DH`;
    window.open(`https://wa.me/${WA}?text=${txt}`, '_blank');
}

renderNav();
renderMain();
</script>
</body>
</html>
