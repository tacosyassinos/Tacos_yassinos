<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tacos Yassinos</title>
    <style>
        :root{--red:#7a0a12;--red2:#9a1520;--gold:#2ecc71;--ink:#fff;--card:#8a1520;--bg:#4d0509;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif}
        header{background:linear-gradient(135deg,#b3121f,#6e0008);color:#fff;border-bottom:4px solid var(--gold);text-align:center;padding:16px 12px}
        header h1{margin:0;font-size:26px;letter-spacing:1px;cursor:pointer;user-select:none;}
        header small{display:block;font-weight:700;margin-top:4px}
        .contact{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
        .contact a{background:var(--gold);color:#06280f;padding:9px 14px;border-radius:20px;text-decoration:none;font-weight:800;font-size:14px}
        nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--red);display:flex;overflow-x:auto;gap:6px;padding:8px;scrollbar-width:none}
        nav button{flex:none;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:18px;padding:7px 13px;font-weight:700}
        nav button.on{background:var(--gold);color:#1a1a1a}
        main{padding:12px 12px 90px;max-width:720px;margin:auto}
        h2{color:var(--gold);margin:18px 0 8px}
        .it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
        .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}.it .e{width:64px;text-align:center;font-size:28px}.it .n{flex:1;font-weight:600}.it .p{color:var(--gold);font-weight:700;font-size:14px}
        .it.off{opacity:.45}
        .b{background:var(--gold);color:#1a1a1a;border:0;border-radius:10px;padding:8px 12px;font-weight:800}
        .sz{display:flex;gap:6px}
        #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--red);border-top:2px solid var(--gold);z-index:6}
        #bar button{width:100%;font-size:16px;padding:13px}
        input,select{width:100%;padding:11px;border-radius:9px;border:0;margin:4px 0;font-size:16px}
        .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
        .q button{width:30px;height:30px;border-radius:8px;border:0;background:var(--gold);font-weight:800}
        .q span{display:inline-block;min-width:26px;text-align:center}
        .tot{border-top:1px solid var(--gold);margin-top:8px;padding-top:8px}
        .hide{display:none}.note{font-size:13px;opacity:.8}
        .card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}.it{box-shadow:0 2px 8px #0006;border-left:4px solid var(--gold)}.ph{box-shadow:0 0 0 2px var(--gold)}h2{border-bottom:2px solid var(--gold);padding-bottom:4px}input,select{background:#fff;color:#222}.b{color:#06280f}.b:disabled{background:#999}header h1{text-shadow:0 2px 6px #0007}
    </style>
</head>

// متغيرات الرمز السري والنقرات
const SECRET_PIN = "1234"; 
let clickCount = 0;
let clickTimer = null;

function tap() {
    clickCount++;
    clearTimeout(clickTimer);
    
    clickTimer = setTimeout(() => {
        clickCount = 0;
    }, 1000);

    if (clickCount >= 5) {
        clickCount = 0;
        let enteredPin = prompt("أدخل الرمز السري للوحة التحكم:");
        if (enteredPin === SECRET_PIN) {
            alert("تم التحقق بنجاح!");
            togglePriceEditor();
        } else if (enteredPin !== null) {
            alert("الرمز السري غير صحيح!");
        }
    }
}

function togglePriceEditor() {
    const panel = document.getElementById("priceEditorPanel");
    panel.classList.toggle("hide");
    if (!panel.classList.contains("hide")) {
        populateItemSelect();
    }
}

function populateItemSelect() {
    const select = document.getElementById("itemSelect");
    select.innerHTML = "";
    for (let cat in M) {
        M[cat].forEach((item, index) => {
            let opt = document.createElement("option");
            opt.value = `${cat}___${index}`;
            let priceText = Array.isArray(item[1]) ? item[1].join('/') : item[1];
            opt.textContent = `[${cat}] ${item[0]} (${priceText} دج)`;
            select.appendChild(opt);
        });
    }
}

function saveNewPrice() {
    const val = document.getElementById("itemSelect").value;
    const newPriceVal = parseFloat(document.getElementById("itemNewPrice").value);
    
    if (!val || isNaN(newPriceVal)) {
        alert("الرجاء اختيار المنتج وإدخال سعر صحيح.");
        return;
    }

    let [cat, index] = val.split("___");
    index = parseInt(index);

    if (Array.isArray(M[cat][index][1])) {
        M[cat][index][1][0] = newPriceVal;
    } else {
        M[cat][index][1] = newPriceVal;
    }

    localStorage.setItem("yassinos_custom_menu", JSON.stringify(M));
    alert("تم تحديث وحفظ السعر بنجاح! سيتم تحديث الصفحة.");
    location.reload();
}

// باقي كود التطبيق الأساسي
const nav=document.getElementById('nav'),main=document.getElementById('main');
let cur=Object.keys(M)[0],cart=[];

function renderNav(){
    nav.innerHTML='';
    Object.keys(M).forEach(k=>{
        let btn=document.createElement('button');
        btn.textContent=(E[k]||'')+' '+k;
        if(k===cur)btn.className='on';
        btn.onclick=()=>{cur=k;renderNav();renderMain()};
        nav.appendChild(btn);
    });
}

function renderMain(){
    main.innerHTML=`<h2>${(E[cur]||'')} ${cur}</h2>`;
    M[cur].forEach((item,i)=>{
        let div=document.createElement('div');
        div.className='it';
        let name=item[0], price=item[1];
        let pHTML='', addFn='';
        if(Array.isArray(price)){
            pHTML=`<div class="sz"><button class="b" onclick="add('${cur}',${i},0)">Petit: ${price[0]}dh</button><button class="b" onclick="add('${cur}',${i},1)">Grand: ${price[1]}dh</button></div>`;
        } else {
            pHTML=`<div class="p">${price} DH</div><button class="b" onclick="add('${cur}',${i})">+</button>`;
        }
        div.innerHTML=`<div class="e">${E[cur]||'🍽️'}</div><div class="n">${name}</div>${pHTML}`;
        main.appendChild(div);
    });
}

function add(cat, idx, sizeIdx){
    let item=M[cat][idx];
    let name=item[0], price=item[1];
    let sizeName='', finalPrice=price;
    if(Array.isArray(price)){
        finalPrice=price[sizeIdx];
        sizeName=(sizeIdx===0?' (Petit)':' (Grand)');
    }
    let found=cart.find(c=>c.cat===cat&&c.idx===idx&&c.sizeIdx===sizeIdx);
    if(found){found.qty++;}
    else{cart.push({cat,idx,sizeIdx,name:name+sizeName,price:finalPrice,qty:1});}
    updateBar();
}

document.getElementById('cartBtn').onclick=()=>{
    let html=`<h2>🛒 Mon Panier</h2>`;
    if(cart.length===0){html+=`<p>Le panier est vide.</p>`;}
    else{
        cart.forEach((c,i)=>{
            html+=`<div class="row"><span>${c.name} - ${c.price} DH</span><div class="q"><button onclick="chg(${i},-1)">-</button><span>${c.qty}</span><button onclick="chg(${i},1)">+</button></div></div>`;
        });
        let tot=cart.reduce((s,c)=>s+c.price*c.qty,0);
        html+=`<div class="row tot"><b>Total:</b> <b>${tot} DH</b></div><button class="b" style="width:100%;margin-top:15px;" onclick="sendWA()">Envoyer sur WhatsApp 💬</button>`;
    }
    main.innerHTML=html;
};

function chg(i,d){
    cart[i].qty+=d;
    if(cart[i].qty<=0)cart.splice(i,1);
    document.getElementById('cartBtn').click();
    updateBar();
}

function updateBar(){
    let totalQty=cart.reduce((s,c)=>s+c.qty,0);
    let totalPrice=cart.reduce((s,c)=>s+c.price*c.qty,0);
    let btn=document.getElementById('cartBtn');
    btn.textContent=totalQty>0?`🛒 Panier (${totalQty} articles) - ${totalPrice} DH`:`🛒 Voir le panier`;
}

function sendWA(){
    let txt="Bonjour, je souhaite commander:%0A";
    cart.forEach(c=>{txt+=`- ${c.qty}x ${c.name} (${c.price*c.qty} DH)%0A`;});
    let tot=cart.reduce((s,c)=>s+c.price*c.qty,0);
    txt+=`%0ATotal: ${tot} DH`;
    window.open(`https://wa.me/${WA}?text=${txt}`,'_blank');
}

renderNav();
renderMain();
</script>
